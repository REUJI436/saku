<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>いらっしゃいませ！マックやさん</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; font-family:"Hiragino Maru Gothic ProN","Comic Sans MS","Yu Gothic",sans-serif; }
html,body { height:100%; overflow:hidden; }
body { background:linear-gradient(180deg,#fff3d6 0%,#ffe0b2 100%); touch-action:manipulation; color:#5d4037; overscroll-behavior:none; }
rt { font-size:0.55em; color:#e53935; font-weight:normal; }

#portalBtn { position:fixed; top:8px; left:8px; z-index:9999; background:linear-gradient(to bottom,#ff8fc0,#d63384); color:#fff; text-decoration:none; padding:8px 12px; border-radius:50%; font-size:20px; border:2px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,0.3); line-height:1; }
#portalBtn:active { transform:scale(0.92); opacity:0.85; }
#muteBtn { position:fixed; top:8px; right:8px; z-index:9999; background:linear-gradient(to bottom,#80c8f5,#2a6da6); color:#fff; border:2px solid #fff; padding:8px 12px; border-radius:50%; font-size:20px; box-shadow:0 2px 6px rgba(0,0,0,0.3); cursor:pointer; line-height:1; }
#muteBtn:active { transform:scale(0.92); opacity:0.85; }

.scene { position:fixed; inset:0; display:none; flex-direction:column; overflow:hidden; }
.scene.active { display:flex; }

.btn { background:linear-gradient(180deg,#ffd54f,#ffb300); color:#6b4500; border:3px solid #fff; border-radius:24px; padding:14px 28px; font-size:22px; font-weight:bold; box-shadow:0 4px 0 #c08820,0 6px 12px rgba(255,179,0,0.4); cursor:pointer; transition:transform 0.08s,box-shadow 0.08s; letter-spacing:1px; }
.btn:active { transform:translateY(3px); box-shadow:0 1px 0 #c08820; }
.btn.red { background:linear-gradient(180deg,#ff8a80,#e53935); color:#fff; box-shadow:0 4px 0 #a32d2d,0 6px 12px rgba(229,57,53,0.4); text-shadow:1px 1px 0 #a32d2d; }
.btn.green { background:linear-gradient(180deg,#c0f0a8,#7cb342); color:#fff; box-shadow:0 4px 0 #4a8030,0 6px 12px rgba(124,179,66,0.4); text-shadow:1px 1px 0 #4a8030; }
.btn.small { font-size:18px; padding:12px 18px; }

#title-scene { justify-content:center; align-items:center; text-align:center; padding:24px; background:radial-gradient(circle at 50% 25%,rgba(255,214,0,0.5),transparent 60%),linear-gradient(180deg,#ffe082,#ffb300); }
#title-scene h1 { font-size:clamp(26px,7vw,44px); color:#e53935; text-shadow:3px 3px 0 #fff; margin-bottom:10px; line-height:1.3; }
.bigburger { font-size:90px; animation:bob 1.5s ease-in-out infinite; }
@keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }

#game-scene { padding:52px 12px 14px; gap:10px; }
.topbar { display:flex; justify-content:center; }
.coinbox { background:#fff; border:3px solid #ffca28; border-radius:999px; padding:6px 20px; font-size:24px; font-weight:bold; color:#7a5c00; display:flex; align-items:center; gap:8px; box-shadow:0 3px 6px rgba(0,0,0,0.12); }
.customer-area { display:flex; align-items:center; gap:12px; background:#fff; border-radius:18px; padding:12px; box-shadow:0 3px 8px rgba(0,0,0,0.1); }
#customer { font-size:60px; }
.order-bubble { background:#e3f2fd; border-radius:16px; padding:10px 14px; flex:1; }
.order-bubble .label { font-size:14px; color:#1976d2; margin-bottom:4px; }
.order-items { display:flex; gap:6px; align-items:center; flex-wrap:wrap; min-height:42px; }
.tray { background:#fff; border:3px dashed #ffb300; border-radius:16px; padding:14px; flex:1; min-height:90px; display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; transition:border-color 0.2s; }
.tray .placeholder { color:#c18a1e; font-size:16px; }
.serve-row { display:flex; gap:10px; justify-content:center; }
.shelf { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
.item-btn { background:#fff; border:3px solid #ffe082; border-radius:14px; padding:8px 2px; text-align:center; cursor:pointer; transition:transform 0.1s; }
.item-btn:active { transform:scale(0.88); }
.item-btn .em { font-size:38px; line-height:1; }
.item-btn .nm { font-size:10px; color:#5d4037; margin-top:3px; }

.sparkle { position:fixed; pointer-events:none; font-size:42px; z-index:9000; animation:sp 0.9s ease-out forwards; }
@keyframes sp { 0%{transform:scale(0) rotate(0);opacity:1} 100%{transform:scale(1.6) rotate(45deg);opacity:0} }
.happy { animation:jump 0.5s ease; }
@keyframes jump { 0%,100%{transform:translateY(0)} 30%{transform:translateY(-22px) scale(1.1)} }
</style>
</head>
<body>
<a id="portalBtn" href="./">🏠</a>
<button id="muteBtn">🔊</button>

<div id="title-scene" class="scene active">
  <div class="bigburger">🍔</div>
  <h1>いらっしゃいませ！<br>マックやさん</h1>
  <p style="font-size:18px;color:#6b4500;margin-bottom:22px;">おきゃくさんの ちゅうもんを<br>つくってあげてね！</p>
  <button class="btn red" id="startBtn">スタート ▶</button>
</div>

<div id="game-scene" class="scene">
  <div class="topbar"><div class="coinbox"><svg width="26" height="26" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#f5c518" stroke="#c99700" stroke-width="2"/><circle cx="12" cy="12" r="5" fill="none" stroke="#c99700" stroke-width="1.5"/></svg><span id="coins">0</span></div></div>
  <div class="customer-area">
    <div id="customer">🐰</div>
    <div class="order-bubble"><div class="label">ちゅうもん</div><div class="order-items" id="order"></div></div>
  </div>
  <div class="tray" id="tray"><span class="placeholder">ここに のせてね</span></div>
  <div class="serve-row">
    <button class="btn green" id="serveBtn">どうぞ！</button>
    <button class="btn small" id="clearBtn">やりなおし</button>
  </div>
  <div class="shelf" id="shelf"></div>
</div>

<script>
const ITEMS = [
  {id:'burger', em:'🍔', name:'ハンバーガー'},
  {id:'potato', em:'🍟', name:'ポテト'},
  {id:'shake',  em:'🥤', name:'シェイク'},
  {id:'juice',  em:'🍊', name:'オレンジジュース'},
  {id:'pie',    em:'🥧', name:'アップルパイ'},
];
const CUSTOMERS = ['🐰','🐻','🐱','🐶','🐸','🐹','🐼','🐯','🐵'];

let coins = 0, order = [], tray = [], muted = false;

function $(id){ return document.getElementById(id); }
function showScene(id){ document.querySelectorAll('.scene').forEach(s=>s.classList.remove('active')); $(id).classList.add('active'); }

function startGame(){ ac(); coins=0; updateCoins(); buildShelf(); showScene('game-scene'); newCustomer(); }

function buildShelf(){
  const shelf=$('shelf'); shelf.innerHTML='';
  ITEMS.forEach(it=>{
    const b=document.createElement('div');
    b.className='item-btn';
    b.innerHTML='<div class="em">'+it.em+'</div><div class="nm">'+it.name+'</div>';
    b.onclick=()=>addToTray(it.id);
    shelf.appendChild(b);
  });
}

function newCustomer(){
  $('customer').textContent = CUSTOMERS[Math.floor(Math.random()*CUSTOMERS.length)];
  const count = coins>=10 ? 3 : coins>=5 ? 2 : 1;
  order=[];
  for(let i=0;i<count;i++) order.push(ITEMS[Math.floor(Math.random()*ITEMS.length)].id);
  tray=[];
  renderOrder(); renderTray();
  setTimeout(speakOrder, 400);
}

function renderOrder(){
  $('order').innerHTML = order.map(id=>'<span style="font-size:34px">'+ITEMS.find(x=>x.id===id).em+'</span>').join('')
    + '<span style="color:#1565c0;font-weight:bold;font-size:16px;margin-left:4px">ください！</span>';
}
function renderTray(){
  const el=$('tray');
  el.innerHTML = tray.length===0 ? '<span class="placeholder">ここに のせてね</span>'
    : tray.map(id=>'<span style="font-size:42px">'+ITEMS.find(x=>x.id===id).em+'</span>').join('');
}

function addToTray(id){ if(tray.length>=6)return; tray.push(id); renderTray(); beep(700,0.06); }
function clearTray(){ tray=[]; renderTray(); beep(330,0.06); }

function serve(){
  if(tray.length===0){ beep(300,0.1); return; }
  const a=[...order].sort().join(','), b=[...tray].sort().join(',');
  if(a===b) correct(); else wrong();
}

function correct(){
  coins++; updateCoins(); sparkleBurst(); successSound();
  $('customer').classList.add('happy');
  speak('ありがとう！');
  setTimeout(()=>{ $('customer').classList.remove('happy'); newCustomer(); }, 1300);
}
function wrong(){
  errorSound(); speak('あれ？ もういちど！');
  const tr=$('tray'); tr.style.borderColor='#e53935';
  setTimeout(()=>{ tr.style.borderColor='#ffb300'; clearTray(); }, 700);
}

function updateCoins(){ $('coins').textContent=coins; }

function sparkleBurst(){
  const marks=['✨','⭐','🌟','💫'];
  for(let i=0;i<10;i++){
    const s=document.createElement('div'); s.className='sparkle';
    s.textContent=marks[i%marks.length];
    s.style.left=(25+Math.random()*50)+'%'; s.style.top=(15+Math.random()*45)+'%';
    document.body.appendChild(s); setTimeout(()=>s.remove(),900);
  }
}

let actx=null;
function ac(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(actx&&actx.state==='suspended') actx.resume(); return actx; }
function beep(freq,dur){ if(muted)return; const c=ac(); if(!c)return; const o=c.createOscillator(),g=c.createGain(); o.frequency.value=freq; o.type='sine'; o.connect(g); g.connect(c.destination); g.gain.setValueAtTime(0.2,c.currentTime); g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+dur); o.start(); o.stop(c.currentTime+dur); }
function successSound(){ if(muted)return; [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.13),i*90)); }
function errorSound(){ if(muted)return; beep(300,0.15); setTimeout(()=>beep(240,0.2),130); }

function speak(text){ if(muted||!window.speechSynthesis)return; try{ const u=new SpeechSynthesisUtterance(text); u.lang='ja-JP'; u.rate=1.0; u.pitch=1.4; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){} }
function speakOrder(){ speak(order.map(id=>ITEMS.find(x=>x.id===id).name).join('と')+'ください'); }

$('startBtn').onclick = startGame;
$('serveBtn').onclick = serve;
$('clearBtn').onclick = clearTray;
$('muteBtn').onclick = function(){ muted=!muted; this.textContent=muted?'🔇':'🔊'; if(muted&&window.speechSynthesis)speechSynthesis.cancel(); };
</script>
</body>
</html>
